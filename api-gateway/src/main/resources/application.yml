server:
  port: ${PORT:8080}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: supplier-service-route
          uri: lb://supplier-service
          predicates:
            - Path=/api/suppliers/**, /suppliers/**

        - id: transaction-service-route
          uri: lb://transaction-service
          predicates:
            - Path=/api/transactions/**, /transactions/**

        - id: finding-service-route
          uri: lb://finding-service
          predicates:
            - Path=/api/findings/**, /findings/**

        - id: notification-service-route
          uri: lb://notification-service
          predicates:
            - Path=/api/notifications/**, /notifications/**

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      show-details: always

