server:
  port: 0

spring:
  application:
    name: supplier-service-test
  cloud:
    config:
      enabled: false
      fail-fast: false
  datasource:
    url: jdbc:h2:mem:supplier_test_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    database-platform: org.hibernate.dialect.H2Dialect

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

